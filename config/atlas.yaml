fast_model: claude-sonnet-5
# Projected to the UI as /state user.name; no extra endpoint.
user: {name: "Daniel"}
google_account: daniel.zhang.t1@gmail.com
# Per model response, not per turn. MAX_TOOL_ROUNDS (4) x 12s exceeds
# turn_ceiling_s by design: the 30s ceiling binds first and bounds the whole
# turn, so the per-response timeout never has to be sized for the worst case.
turn_timeout_s: 12.0
turn_ceiling_s: 30.0
# Per model response, not per turn: each tool round spends its own budget, and
# the tool-call JSON is charged to it before any spoken text. A larger cap
# makes a round that stops INSIDE the tool_use block -- no text at all, total
# silence -- less likely; it does not guarantee room for a reply, and nothing
# here can. EMPTY_TURN_REPLY (worker/brain.py) is what makes that case safe.
# 500 rather than 700 for timeout headroom, measured: 700-token rounds ran
# 8.9-14.9s end to end (time-to-first-token variance dominates) and 2 of 8
# exceeded turn_timeout_s. A timeout mid-stream discards the round and speaks
# "I lost that one" after ~11s of audio, which is worse than truncation now
# that truncation says TRUNCATED_REPLY honestly -- so the cap, not the
# timeout, should be the likelier terminator of a long reply.
max_tokens: 500
engagement_timeout_s: 120
addressed_window_s: 90
address_vocab: [gmail, inbox, unread, calendar, youtube, notion, github, spotify, workers]

job_store_path: "%LOCALAPPDATA%/Atlas/jobs.sqlite3"
work_workspace_path: "%LOCALAPPDATA%/Atlas/jobs"
state_port: 4360
stt_keyterms: [Atlas]

# Self-barge-in (Atlas's own TTS output re-entering its mic and getting
# transcribed as a fragmentary user turn that cuts playout short) is
# actually fixed by worker.app.SpeechEchoGuard/AtlasAgent.stt_node, which
# drops STT transcripts that echo what Atlas is currently saying -- not by
# these three knobs. They are kept as harmless defense-in-depth, and their
# REAL, measured semantics (read from the installed livekit-agents 1.6.6
# source, not assumed) are weaker than the names suggest -- see the full
# comment at the AgentSession construction in worker/app.py:
#   - min_interruption_words: the only one of the three actually enforced
#     on the STT interim-transcript path Atlas uses. Still just a word
#     count floor -- a 3+ word echo fragment ("two fifty five") clears it.
#   - min_interruption_duration_s: NOT enforced on that STT path at all;
#     only affects a VAD-driven interruption, which STT turn detection
#     barely exercises.
#   - aec_warmup_duration_s: a ONE-SHOT grace period for the session's
#     FIRST utterance only (livekit-agents permanently zeroes it after the
#     first "speaking" transition) -- every later response gets none of it.
# Validated on load by worker.app._voice_config, which raises on load if a
# value is out of range.
# The four knobs after the livekit three are SpeechEchoGuard's own, exposed
# here rather than living only as class defaults (2026-09-01 final gate, F7):
# they are the ones that actually decide whether a genuine barge-in survives,
# so they are the ones worth tuning. Same names as the constructor keywords.
#   - tail_s: how long after Atlas stops speaking an echo can still arrive.
#     Nothing is ever filtered outside speaking + this tail, and a new
#     utterance starting more than this after the last speech clears the
#     buffer, so raising it widens BOTH windows.
#   - buffer_window_s: how long after speech stops the buffer survives at all.
#   - max_words: memory cap on the buffer; the whole current utterance is
#     held regardless of length while speaking, bounded only by this.
#   - min_overlap_ratio: for 5+ word transcripts only, the share of words that
#     must appear in the buffer for a scattered/reordered fragment to count as
#     an echo. Shorter transcripts require a contiguous match and ignore this.
# Every value is validated on load by worker.app._voice_config; an out-of-range
# one raises rather than falling back.
voice:
  min_interruption_words: 2
  min_interruption_duration_s: 0.8
  aec_warmup_duration_s: 4.0
  tail_s: 1.0
  buffer_window_s: 10.0
  max_words: 500
  min_overlap_ratio: 0.8

traces: {enabled: true, path: "%LOCALAPPDATA%/Atlas/traces.db", retention_days: 30}
pricing:
  # Source: https://docs.anthropic.com/en/docs/about-claude/pricing
  # Mode: standard; cache writes below are the default 5-minute rate.
  # A 1-hour cache write is billed at 2x base input; cache_ttl selects that multiplier.
  # Last verified: 2026-08-27
  cache_ttl: 1h
  claude-haiku-4-5:
    input_per_mtok: 1.0
    output_per_mtok: 5.0
    cache_read_per_mtok: 0.1
    cache_write_per_mtok: 1.25
  claude-sonnet-5:
    input_per_mtok: 2.0
    output_per_mtok: 10.0
    cache_read_per_mtok: 0.2
    cache_write_per_mtok: 2.5

active_voice: mars
voices:
  matilda: {vendor: elevenlabs, voice_id: XrExE9yKIg1WjnnlVkGX, model: eleven_turbo_v2_5}
  mars: {vendor: deepgram, model: aura-2-mars-en}

wake_model: hey_atlas
wake_input_device: follow
wake_threshold: 0.5
wake_patience: 3
tts_output_device: follow

# Read scope: the built-in LocalFiles tools (find_file, read_file, open_file,
# open_folder) are confined to these.
#
# Each entry is also a NAME the model can pass as open_folder's `root` (and as
# find_file's optional `root` scope): a known: entry is named by its folder
# name, a bare path by its basename, and the {path:, name:} form names a root
# explicitly. Those names become a closed enum in the tool schemas, which is
# both how the model learns the roots exist and why a root survives the taint
# wall -- it is one of N host-authored constants, not a model-authored path.
# Names here: desktop, documents, downloads, kb, home.
#
# The four narrow roots are kept alongside home deliberately, even though home
# contains three of them: they keep the enum ergonomic ("open my downloads")
# and keep those searches sharp. Overlap is handled -- find dedupes both the
# results and the directories it walks -- and confinement is unaffected, since
# every path is checked against the roots either way.
#
# home is wide, so searches under it are bounded rather than exhaustive: the
# scan keeps the depth-6 / 2s budget it has always had, which means a home-wide
# find_file can be PARTIAL. In practice every search now costs the FULL 2s --
# there is enough tree to exhaust the budget, so the old "finishes early on a
# small root" case is gone and 2s is a floor, not a ceiling. Prefer a root:
# scope when the folder is known; it is the same 2s, spent in one place.
#
# ORDER HERE DOES NOT DECIDE WHAT GETS SEARCHED. Each root is given a fair
# share of the remaining budget (worker/localfiles.py find), so the last entry
# cannot be starved by the ones above it -- which is what happened when home
# was added under a single shared deadline: the four narrow roots spent the
# whole 2s and files sitting directly in ~ were unfindable while the search
# reported nothing found. Order is therefore left in narrowest-to-widest
# reading order rather than tuned.
#
# One deliberate loss from the hidden-component rule: dot directories inside the
# NARROW roots are no longer readable either -- kb/.claude and kb/.github used to
# be. Credential exposure is not separable per root by filename, so the rule is
# uniform; if those files are wanted back, that is a scoped decision to make
# explicitly rather than a side effect of widening to home.
#
# Credentials are not in scope at any width, for THESE tools: worker/localfiles.py
# refuses AppData, every hidden dot component (.ssh, .aws, .claude, .mcp.json,
# .git-credentials, ...), and credential-stemmed names (credentials.*, token.*,
# client_secret*, secrets.*, id_rsa*) at the single resolve() choke point --
# checked both lexically and on the resolved path, so 8.3 short names and
# trailing dots cannot walk past it. A root may not itself sit inside a hidden
# directory. So constitution rule 1 holds structurally here, not by the accident
# of a narrow root. Note the scope of that claim: it covers find_file, read_file,
# open_file and open_folder. launch_work is NOT bounded by it -- it hands a brief
# to a background claude --bg with its own filesystem access.
# Every OTHER read path was closed rather than left to hold the same claim
# twice: the files MCP server exposes no read tool at all (config/mcp.yaml,
# files: -- 2026-09-01 final gate, F3), so the tools above are the only way a
# model-shaped request reads a file, and the shield is on all of them.
file_roots:
  - known:Desktop
  - known:Documents
  - known:Downloads
  - C:/Users/danie/kb
  - {path: C:/Users/danie, name: home}
# Write scope: the ONLY directories the files MCP server is started with, so
# the only ones its write_file/edit_file/create_directory/move_file (all
# confirm-gated) can ever touch. Deliberately a subset of file_roots without
# kb: the kb checkout is read-only to Atlas, and kb changes go through the kb
# bridge's own mutations gate. Adding a root here is a deliberate widening of
# what Atlas may write -- Daniel's decision, not a side effect of adding a
# read root (see config/mcp.yaml, files:).
file_write_roots: [known:Desktop, known:Documents, known:Downloads]

kb_bridge: {enabled: true, mutations: true, path: "C:/Users/danie/kb-worktrees/atlas-bridge/dashboard/atlas-bridge", origin: "http://127.0.0.1:5317"}

fast_model: claude-sonnet-5
# Projected to the UI as /state user.name; no extra endpoint.
user: {name: "Daniel"}
google_account: daniel.zhang.t1@gmail.com
# Per model response, not per turn. MAX_TOOL_ROUNDS (4) x 12s exceeds
# turn_ceiling_s by design: the 30s ceiling binds first and bounds the whole
# turn, so the per-response timeout never has to be sized for the worst case.
turn_timeout_s: 12.0
turn_ceiling_s: 30.0
# Per model response, not per turn: each tool round spends its own budget, and
# the tool-call JSON is charged to it before any spoken text. A larger cap
# makes a round that stops INSIDE the tool_use block -- no text at all, total
# silence -- less likely; it does not guarantee room for a reply, and nothing
# here can. EMPTY_TURN_REPLY (worker/brain.py) is what makes that case safe.
# 500 rather than 700 for timeout headroom, measured: 700-token rounds ran
# 8.9-14.9s end to end (time-to-first-token variance dominates) and 2 of 8
# exceeded turn_timeout_s. A timeout mid-stream discards the round and speaks
# "I lost that one" after ~11s of audio, which is worse than truncation now
# that truncation says TRUNCATED_REPLY honestly -- so the cap, not the
# timeout, should be the likelier terminator of a long reply.
max_tokens: 500
engagement_timeout_s: 120
addressed_window_s: 90
address_vocab: [gmail, inbox, unread, calendar, youtube, notion, github, spotify, workers]

job_store_path: "%LOCALAPPDATA%/Atlas/jobs.sqlite3"
work_workspace_path: "%LOCALAPPDATA%/Atlas/jobs"
state_port: 4360
stt_keyterms: [Atlas]

traces: {enabled: true, path: "%LOCALAPPDATA%/Atlas/traces.db", retention_days: 30}
pricing:
  # Source: https://docs.anthropic.com/en/docs/about-claude/pricing
  # Mode: standard; cache writes below are the default 5-minute rate.
  # A 1-hour cache write is billed at 2x base input; cache_ttl selects that multiplier.
  # Last verified: 2026-08-27
  cache_ttl: 1h
  claude-haiku-4-5:
    input_per_mtok: 1.0
    output_per_mtok: 5.0
    cache_read_per_mtok: 0.1
    cache_write_per_mtok: 1.25
  claude-sonnet-5:
    input_per_mtok: 2.0
    output_per_mtok: 10.0
    cache_read_per_mtok: 0.2
    cache_write_per_mtok: 2.5

active_voice: mars
voices:
  matilda: {vendor: elevenlabs, voice_id: XrExE9yKIg1WjnnlVkGX, model: eleven_turbo_v2_5}
  mars: {vendor: deepgram, model: aura-2-mars-en}

wake_model: hey_atlas
wake_input_device: follow
wake_threshold: 0.5
wake_patience: 3
tts_output_device: follow

# Read scope: the built-in LocalFiles tools (find_file, read_file, open_file,
# open_folder) are confined to these.
file_roots: [known:Desktop, known:Documents, known:Downloads, C:/Users/danie/kb]
# Write scope: the ONLY directories the files MCP server is started with, so
# the only ones its write_file/edit_file/create_directory/move_file (all
# confirm-gated) can ever touch. Deliberately a subset of file_roots without
# kb: the kb checkout is read-only to Atlas, and kb changes go through the kb
# bridge's own mutations gate. Adding a root here is a deliberate widening of
# what Atlas may write -- Daniel's decision, not a side effect of adding a
# read root (see config/mcp.yaml, files:).
file_write_roots: [known:Desktop, known:Documents, known:Downloads]

kb_bridge: {enabled: true, mutations: true, path: "C:/Users/danie/kb-worktrees/atlas-bridge/dashboard/atlas-bridge", origin: "http://127.0.0.1:5317"}
